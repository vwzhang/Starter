name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_aspire_smoke:
        description: "Run the Docker-backed Aspire integration smoke test"
        required: false
        default: false
        type: boolean

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Starter.slnx

      - name: Build
        run: dotnet build Starter.slnx --no-restore

      - name: Aspire smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_aspire_smoke }}
        run: dotnet test Starter.slnx --no-build --logger "console;verbosity=detailed"

      - name: Smoke test note
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_aspire_smoke }}
        run: |
          echo "Build completed."
          echo "The Aspire integration smoke test pulls Docker images and is manual in GitHub Actions to avoid public-runner Docker Hub 429 rate limits."
          echo "Run locally with: dotnet test Starter.slnx --no-build"
